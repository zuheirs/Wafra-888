{% extends "base.html" %}
{% block title %}غيّر كلمة السر — وفرة 888{% endblock %}
{% block content %}
<div class="eyebrow">Mastermind</div>
<h1>غيّر كلمة السر</h1>
<p class="sub">أهلاً {{ account.name }} — هاي أول مرة تدخل، لازم تحط كلمة سر جديدة خاصة فيك (4 محارف عالأقل).</p>
<div class="center-screen">
  <div class="card">
    <form method="post" action="{{ url_for('auth.change_password_submit') }}">
      <div class="field"><label>كلمة سر جديدة</label><input type="password" name="password1" required></div>
      <div class="field"><label>تأكيد كلمة السر</label><input type="password" name="password2" required></div>
      <button type="submit">حفظ وتابع</button>
      {% if error %}<div class="error visible">{{ error }}</div>{% endif %}
    </form>
  </div>
</div>
{% endblock %}
